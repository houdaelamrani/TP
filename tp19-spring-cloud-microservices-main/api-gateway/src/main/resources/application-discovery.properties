eureka.client.fetch-registry=true
spring.cloud.discovery.enabled=true
# Routes explicites lb:// : inutile de generer aussi des routes /SERVICE-NAME/**.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=patients-discovery
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SERVICE-PATIENT
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients,/patients/**,/patient/**
spring.cloud.gateway.server.webflux.routes[1].id=rdv-discovery
spring.cloud.gateway.server.webflux.routes[1].uri=lb://SERVICE-RDV
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/rdv,/rdv/**
