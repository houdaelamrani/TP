# Les routes restent utilisables meme sans registre Eureka.
eureka.client.fetch-registry=false
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=patients-static
spring.cloud.gateway.server.webflux.routes[0].uri=${gateway.patients-uri:http://localhost:8088}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients,/patients/**,/patient/**
spring.cloud.gateway.server.webflux.routes[1].id=rdv-static
spring.cloud.gateway.server.webflux.routes[1].uri=${gateway.rdv-uri:http://localhost:8089}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/rdv,/rdv/**
